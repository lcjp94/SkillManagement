name: CI

# Windows seulement : décision du porteur du projet (26 octobre 2026). macOS et Linux ne sont ni construits ni testés.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      - name: Parcours de bout en bout (application compilée)
        run: npx playwright test

      # Installeur NSIS non signé : aucun certificat n'est requis (voir docs/DISTRIBUTION.md)
      - name: Installeur Windows
        run: npm run package

      - name: Application empaquetée, installation et désinstallation silencieuses, mise à jour
        run: npm run test:installeur

      - name: Conserver l'installeur
        uses: actions/upload-artifact@v4
        with:
          name: installeur-windows
          path: |
            release/SkillManagement-Setup-*.exe
            release/SkillManagement-Setup-*.exe.blockmap
          if-no-files-found: error
