name: CI

# Windows seulement : décision du porteur du projet (26 octobre 2026). macOS et Linux ne sont ni construits ni testés.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      - name: Test de fumée de l'application compilée
        run: npx playwright test
